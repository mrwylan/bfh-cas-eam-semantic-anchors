name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.11.1

      - name: Extract Version from Tag
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # Tag «v1.0.0» → Versionsstring «1.0.0» (führendes v entfernt).
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Compile PDF
        run: |
          typst compile main.typ "bfh-cas-eam-${{ steps.version.outputs.tag }}.pdf" \
            --input version=${{ steps.version.outputs.number }} \
            --input year=${{ steps.version.outputs.year }}

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD")
          fi
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG"        >> "$GITHUB_OUTPUT"
          echo "EOF"         >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## BFH CAS EAM — Learning Path Documentation ${{ steps.version.outputs.tag }}

            ### Changes
            ${{ steps.changelog.outputs.log }}

            ---
            Compiled with Typst 0.11.1 · [CI run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: "bfh-cas-eam-${{ steps.version.outputs.tag }}.pdf"
          fail_on_unmatched_files: true
