name: Release

on:
  push:
    tags:
      # Matcht zwei- und dreistellige Versionstags: v1.2 ebenso wie v1.2.0.
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Versionstag, z. B. v1.2 oder v1.2.0 (muss bereits existieren)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Bei manuellem Start (workflow_dispatch) den angegebenen Tag auschecken,
          # beim Tag-Push den pushenden Ref.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.11.1

      - name: Extract Version from Tag
        id: version
        env:
          # Beim Tag-Push der gepushte Tag, beim manuellen Start der Eingabewert.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          # «v1.2.0» → «1.2.0» (führendes v entfernt) → «1.2» (major.minor).
          # cut -f1,2 ist robust für zwei- und dreistellige Tags (v1.2 bleibt v1.2).
          NUMBER=$(echo "${RELEASE_TAG#v}" | cut -d. -f1,2)
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Compile PDF
        run: |
          typst compile main.typ "bfh-cas-eam-semantic-anchors-v${{ steps.version.outputs.number }}.pdf" \
            --input version=${{ steps.version.outputs.number }} \
            --input year=${{ steps.version.outputs.year }}

      - name: Generate Changelog
        id: changelog
        run: |
          # Akzeptiert zwei- und dreistellige Versionstags (v1.2 und v1.2.0).
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "${PREVIOUS_TAG}..HEAD")
          fi
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG"        >> "$GITHUB_OUTPUT"
          echo "EOF"         >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            ## BFH CAS EAM — Semantic Anchors v${{ steps.version.outputs.number }}

            ### Changes
            ${{ steps.changelog.outputs.log }}

            ---
            Compiled with Typst 0.11.1 · [CI run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: "bfh-cas-eam-semantic-anchors-v${{ steps.version.outputs.number }}.pdf"
          fail_on_unmatched_files: true
